# Netlify Configuration for AgriShield (KrishiKavach)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) redirect rule for React Router / client routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
